name: Atlas Build

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin 5f96cd15fd745122cf27e0524606d6c1efc5fd07
          git -C "$env:VCPKG_ROOT" checkout --detach 5f96cd15fd745122cf27e0524606d6c1efc5fd07
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows'

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"
          cmake --preset headless-vcpkg

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"
          cmake --build --preset headless-vcpkg

      - name: Test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set "VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg"
          ctest --preset headless-vcpkg --output-on-failure
